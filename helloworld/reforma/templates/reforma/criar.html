{% extends "base.html" %}
{% load static icons %}

{% block title %}Novo item — Reforma{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'reforma/reforma.css' %}">
{% endblock %}

{% block topo_acoes %}
<a class="btn btn-outline" href="{% url 'listar_reforma' %}">← Voltar</a>
{% endblock %}

{% block content %}
<section class="pagina">
    <div class="pagina-header">
        <div>
            <p class="eyebrow">Módulo M-02 · Reforma</p>
            <h1>Novo item</h1>
        </div>
    </div>

    <div class="card form-card surgir">
        <form class="campos" method="post">
            {% csrf_token %}

            <div class="campo campo-full">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" placeholder="Ex.: Pintura da sala" required>
            </div>

            <div class="campo campo-full">
                <label for="categoria">Categoria</label>
                <input id="categoria" name="categoria" placeholder="Ex.: Pintura, Elétrica, Hidráulica..." required>
            </div>

            <div class="campo">
                <label for="custo_estimado">Custo estimado</label>
                <input id="custo_estimado" type="number" step="0.01" name="custo_estimado" placeholder="0,00" required>
            </div>

            <div class="campo">
                <label for="custo_real">Custo real</label>
                <input id="custo_real" type="number" step="0.01" name="custo_real" placeholder="0,00">
            </div>

            <div class="campo">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="planejamento">Planejamento</option>
                    <option value="em_andamento">Em andamento</option>
                    <option value="concluido">Concluído</option>
                </select>
            </div>

            <div class="campo">
                <label for="prioridade">Prioridade (1 a 5)</label>
                <input id="prioridade" type="number" min="1" max="5" name="prioridade" placeholder="3" required>
            </div>

            <div class="campo campo-full">
                <label for="data_estimavel">Data estimável</label>
                <input id="data_estimavel" type="date" name="data_estimavel" required>
            </div>

            <button class="btn btn-primary campo-full" type="submit">
                {% icon 'check-circle-2' 'icone-sm' %} Salvar item
            </button>
        </form>
    </div>
</section>
{% endblock %}
